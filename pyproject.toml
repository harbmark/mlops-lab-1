[project]
name = "mlops-lab-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mark Harb", email = "mark.harb@net.usj.edu.lb" }
]
requires-python = ">=3.10"
dependencies = [
    "mlflow>=3.16.0",
    "pillow>=12.3.0",
    "scikit-learn>=1.7.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[project.scripts]
mlops-lab-1 = "mlops_lab_1:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
